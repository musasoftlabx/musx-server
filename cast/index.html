<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>Muzix Audio Receiver</title>

    <script src="//www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
    <script src="//www.gstatic.com/cast/sdk/libs/devtools/debug_layer/caf_receiver_logger.js"></script>

    <link rel="stylesheet" href="styles.css" />
  </head>

  <body class="no-lyrics">
    <audio id="audio" autoplay></audio>
    <div class="ambient" aria-hidden="true">
      <img id="ambientArt" src="artwork.png" alt="" />
    </div>
    <main class="screen">
      <header class="header">
        <div class="brand-container">
          <div class="brand">Muzix.</div>
          <div class="brand-caption">player</div>
        </div>

        <div
          id="logs"
          style="
            background: rgba(0, 0, 0, 0.8);
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            z-index: 1000;
          "
        ></div>
        <aside id="nextTrack" class="next-track" aria-label="Next track" hidden>
          <img
            id="nextArtwork"
            class="next-track-artwork"
            src="artwork.png"
            alt=""
          />
          <div class="next-track-info">
            <div class="next-track-label">UP NEXT</div>
            <div id="nextTitle" class="next-track-title">No upcoming track</div>
            <div class="next-track-detail">
              <span id="nextArtist"></span>
            </div>
          </div>
        </aside>
      </header>

      <section class="player">
        <div class="now-playing">
          <div class="artwork-container">
            <div class="album-disc">
              <img id="artwork" src="artwork.png" alt="Album artwork" />
            </div>
            <div class="album-cover-hinge"></div>
            <img
              id="albumCover"
              class="album-cover"
              src="artwork.png"
              alt=""
              aria-hidden="true"
            />
            <div class="album-cover-glass" aria-hidden="true"></div>
          </div>

          <div class="track-info">
            <div class="eyebrow">
              <span class="pulse"></span
              ><span id="playbackState" class="playback-status">
                NOW PLAYING</span
              >
            </div>

            <h1 id="title">title</h1>

            <div class="artist-detail">
              <img
                id="artistImage"
                class="artist-image"
                hidden
                alt=""
                aria-hidden="true"
              />

              <svg
                id="artistIcon"
                class="artist-icon"
                viewBox="0 0 24 24"
                aria-hidden="true"
              >
                <path
                  d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8Zm7 8a7 7 0 0 0-14 0"
                />
              </svg>

              <div id="artistMarquee" class="artist-marquee">
                <h3 id="artist">artist</h3>
              </div>
            </div>

            <div class="album-detail">
              <svg class="album-icon" viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="12" cy="12" r="9" />
                <circle cx="12" cy="12" r="2" />
              </svg>
              <h4 id="album">album</h4>
            </div>
          </div>
        </div>

        <aside class="lyrics-panel" aria-label="Lyrics">
          <div class="lyrics-header">
            <span class="lyrics-label">LYRICS</span>
            <span id="lyricsMode" class="lyrics-mode"></span>
          </div>

          <div class="lyrics-viewport">
            <div id="lyrics" class="lyrics-scroller"></div>
          </div>
        </aside>
      </section>

      <footer class="footer">
        <div class="progress-section">
          <span id="elapsed">00:00</span>

          <div class="progress-track">
            <div id="progress"></div>
          </div>

          <span id="total">00:00</span>
        </div>

        <div class="footer-brand">© Musasoft Labs Inc.</div>
      </footer>
    </main>

    <script src="receiver.js"></script>
  </body>
</html>
