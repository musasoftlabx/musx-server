<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>Muzix Audio Receiver</title>

    <script src="//www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
    <script src="//www.gstatic.com/cast/sdk/libs/devtools/debug_layer/caf_receiver_logger.js"></script>

    <link rel="stylesheet" href="styles.css" />
  </head>

  <body class="no-lyrics">
    <audio id="audio" autoplay></audio>
    <div class="ambient" aria-hidden="true">
      <img id="ambientArt" src="artwork.png" alt="" />
    </div>
    <main class="screen">
      <header class="header">
        <div class="brand">
          <span class="brand-mark">
            <img id="logo" src="logo.png" alt="App logo" class="logo" />
          </span>
          <span>Musix</span>
        </div>

        <div id="logs"></div>
        <aside id="nextTrack" class="next-track" aria-label="Next track" hidden>
          <img
            id="nextArtwork"
            class="next-track-artwork"
            src="artwork.png"
            alt=""
          />
          <div class="next-track-info">
            <div class="next-track-label">UP NEXT</div>
            <div id="nextTitle" class="next-track-title">No upcoming track</div>
            <div id="nextArtist" class="next-track-detail"></div>
          </div>
        </aside>
      </header>

      <section class="player">
        <div class="now-playing">
          <div class="artwork-container">
            <div class="album-disc">
              <img id="artwork" src="artwork.png" alt="Album artwork" />
            </div>
            <img
              id="albumCover"
              class="album-cover"
              src="artwork.png"
              alt=""
              aria-hidden="true"
            />
          </div>

          <div class="track-info">
            <div class="eyebrow"><span class="pulse"></span> NOW PLAYING</div>

            <h1 id="title">title</h1>

            <h2 id="artist">artist</h2>

            <p id="album">album</p>
          </div>
        </div>

        <aside class="lyrics-panel" aria-label="Lyrics">
          <div class="lyrics-header">
            <span class="lyrics-label">LYRICS</span>
            <span id="lyricsMode" class="lyrics-mode"></span>
          </div>

          <div class="lyrics-viewport">
            <div id="lyrics" class="lyrics-scroller"></div>
          </div>
        </aside>
      </section>

      <footer class="footer">
        <div class="progress-section">
          <span id="elapsed">00:00</span>

          <div class="progress-track">
            <div id="progress"></div>
          </div>

          <span id="total">00:00</span>
        </div>

        <!-- <div class="playback-status">
          <span id="playbackState">READY TO PLAY</span>
        </div> -->

        <div class="footer-brand">Developed with ❤️ by Musasoft Labs</div>
      </footer>
    </main>

    <script src="receiver.js"></script>
  </body>
</html>
