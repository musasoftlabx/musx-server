on:
  push:
    branches: ["main"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@master
        env:
          env_var: ${{ vars.OPENAPI_KEY }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            cd /media
            git config --global --add safe.directory /media
            ls
            echo ${{ secrets.VPS_PASSWORD }} | sudo -S git stash
            echo ${{ secrets.VPS_PASSWORD }} | sudo -S git pull
            echo ${{ secrets.VPS_PASSWORD }} | sudo -S /root/.bun/bin/bun i
            echo ${{ secrets.VPS_PASSWORD }} | sudo -S /root/.bun/bin/pm2 restart index.ts

# Fix Issue regarding deploying due to bun command
# https://github.com/appleboy/ssh-action/issues/31#issuecomment-1006565847 (Comment out [ -z "$PS1" ] && return` in /etc/bash.bashrc)
